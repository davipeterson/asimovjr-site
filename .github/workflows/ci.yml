name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Formatação, lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  lighthouse:
    name: Lighthouse (celular)
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build na raiz (/) para o servidor local do Lighthouse achar os arquivos.
      - run: npm run build
        env:
          SITE_URL: http://localhost
          BASE_PATH: /
      - run: npx --yes @lhci/cli@0.16.x autorun
